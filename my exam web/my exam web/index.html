<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Study Portal - Login</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #5a5a7a;
            --accent: #4a7bd9;
            --accent-hover: #3b6bc5;
            --input-bg: #f8f9fc;
            --input-border: #d9dce6;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo span { font-size: 2.8rem; }
        h1 { font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 6px; color: var(--text); }
        .subtitle { text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 28px; }
        .toggle-btns { display: flex; gap: 10px; margin-bottom: 28px; background: #f0f2f8; padding: 5px; border-radius: 12px; }
        .toggle-btn { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; color: var(--text-secondary); transition: 0.2s; }
        .toggle-btn.active { background: white; color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .form-panel { display: none; }
        .form-panel.active { display: block; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 5px; color: var(--text-secondary); }
        .input-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--input-border); border-radius: 10px; background: var(--input-bg); font-size: 0.9rem; color: var(--text); transition: border 0.2s; outline: none; }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74, 123, 217, 0.1); }
        .row { display: flex; gap: 12px; }
        .row .input-group { flex: 1; }
        .btn { width: 100%; padding: 13px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-top: 6px; transition: background 0.2s; }
        .btn:hover { background: var(--accent-hover); }
        .error-msg { color: #dc2626; font-size: 0.75rem; text-align: center; margin-top: 10px; display: none; }
        .note { text-align: center; font-size: 0.7rem; color: var(--text-secondary); margin-top: 20px; line-height: 1.4; }
        @media (max-width: 480px) { .container { padding: 28px 20px; } .row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><span>📚</span></div>
        <h1>Study Portal</h1>
        <p class="subtitle">Organize your learning journey</p>

        <div class="toggle-btns">
            <button class="toggle-btn active" id="loginToggle">🔑 Login</button>
            <button class="toggle-btn" id="registerToggle">✨ Register</button>
        </div>

        <div class="form-panel active" id="loginPanel">
            <div class="input-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="input-group">
                <label>🔒 Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password">
            </div>
            <button class="btn" id="loginBtn">Log In</button>
            <div class="error-msg" id="loginError"></div>
        </div>

        <div class="form-panel" id="registerPanel">
            <div class="row">
                <div class="input-group">
                    <label>🧑 First Name</label>
                    <input type="text" id="regFirstName" placeholder="John">
                </div>
                <div class="input-group">
                    <label>👤 Last Name</label>
                    <input type="text" id="regLastName" placeholder="Doe">
                </div>
            </div>
            <div class="input-group">
                <label>📧 Email</label>
                <input type="email" id="regEmail" placeholder="your@email.com">
            </div>
            <div class="input-group">
                <label>📱 Mobile Number</label>
                <input type="tel" id="regMobile" placeholder="+91 9876543210">
            </div>
            <div class="input-group">
                <label>🔒 Password</label>
                <input type="password" id="regPassword" placeholder="8+ chars, A-Z, a-z, 0-9">
            </div>
            <button class="btn" id="registerBtn">Create Account</button>
            <div class="error-msg" id="regError"></div>
        </div>

        <div class="note">⚡ Other users require admin approval to access.</div>
    </div>

    <script>
        (function() {
            const APP_USERS_KEY = 'portal_registered_users';
            const USER_SESSION_KEY = 'dashboard_user_profile';
            const SETTINGS_KEY = 'dashboard_settings';
            const SUPER_ADMIN_EMAIL = 'vkpanwar2004@gmail.com';

            function getStoredUsers() {
                const data = localStorage.getItem(APP_USERS_KEY);
                if (!data) return [];
                try { return JSON.parse(data); } catch(e) { return []; }
            }

            function saveUsers(users) {
                localStorage.setItem(APP_USERS_KEY, JSON.stringify(users));
            }

            // Passwords are never stored as plain text. PBKDF2 + random salt is used.
            const PBKDF2_ITERATIONS = 120000;
            const encoder = new TextEncoder();

            function bytesToBase64(bytes) {
                let binary = '';
                bytes.forEach(b => binary += String.fromCharCode(b));
                return btoa(binary);
            }

            function base64ToBytes(value) {
                const binary = atob(value);
                return Uint8Array.from(binary, c => c.charCodeAt(0));
            }

            async function hashPassword(password, saltBytes) {
                const keyMaterial = await crypto.subtle.importKey(
                    'raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits']
                );
                const bits = await crypto.subtle.deriveBits(
                    { name: 'PBKDF2', salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
                    keyMaterial, 256
                );
                return bytesToBase64(new Uint8Array(bits));
            }

            async function createPasswordRecord(password) {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                return {
                    passwordHash: await hashPassword(password, salt),
                    passwordSalt: bytesToBase64(salt),
                    passwordIterations: PBKDF2_ITERATIONS
                };
            }

            async function verifyPassword(user, password) {
                // Backward compatibility: upgrade old plain-text accounts after a successful login.
                if (user.password && !user.passwordHash) {
                    if (user.password !== password) return false;
                    const record = await createPasswordRecord(password);
                    delete user.password;
                    Object.assign(user, record);
                    return true;
                }
                if (!user.passwordHash || !user.passwordSalt) return false;
                try {
                    const salt = base64ToBytes(user.passwordSalt);
                    const hash = await hashPassword(password, salt);
                    return hash === user.passwordHash;
                } catch(e) {
                    return false;
                }
            }

            function getSettings() {
                const s = localStorage.getItem(SETTINGS_KEY);
                if (s) {
                    try { return JSON.parse(s); } catch(e) {}
                }
                return { approvalRequired: true };
            }

            function showError(panel, msg) {
                const el = document.getElementById(panel === 'login' ? 'loginError' : 'regError');
                el.textContent = msg;
                el.style.display = 'block';
                setTimeout(() => { el.style.display = 'none'; }, 4000);
            }

            function getLockInfo(email) {
                try { return JSON.parse(localStorage.getItem('login_lock_' + email)) || { attempts: 0, lockedUntil: 0 }; }
                catch(e) { return { attempts: 0, lockedUntil: 0 }; }
            }

            function isLocked(email) {
                const info = getLockInfo(email);
                if (info.lockedUntil && Date.now() < info.lockedUntil) return info.lockedUntil;
                return 0;
            }

            function recordFailedLogin(email) {
                const info = getLockInfo(email);
                info.attempts = (info.attempts || 0) + 1;
                if (info.attempts >= 5) {
                    info.lockedUntil = Date.now() + (15 * 60 * 1000);
                    info.attempts = 0;
                }
                localStorage.setItem('login_lock_' + email, JSON.stringify(info));
            }

            function clearLoginLock(email) {
                localStorage.removeItem('login_lock_' + email);
            }

            async function createSession(user) {
                // Session remains active until the user explicitly logs out.
                localStorage.setItem(USER_SESSION_KEY, JSON.stringify({
                    name: user.name || 'User',
                    email: user.email,
                    loggedInAt: Date.now(),
                    persistent: true
                }));
            }

            // If the user is already logged in, do not ask for the password again.
            // dashboard.html will validate the stored account before opening the workspace.
            try {
                const existingSession = JSON.parse(localStorage.getItem(USER_SESSION_KEY) || 'null');
                if (existingSession && existingSession.email) {
                    window.location.replace('dashboard.html');
                    return;
                }
            } catch (e) {
                localStorage.removeItem(USER_SESSION_KEY);
            }

            // Toggle
            document.getElementById('loginToggle').onclick = () => {
                document.getElementById('loginToggle').classList.add('active');
                document.getElementById('registerToggle').classList.remove('active');
                document.getElementById('loginPanel').classList.add('active');
                document.getElementById('registerPanel').classList.remove('active');
                document.getElementById('loginError').style.display = 'none';
                document.getElementById('regError').style.display = 'none';
            };
            document.getElementById('registerToggle').onclick = () => {
                document.getElementById('registerToggle').classList.add('active');
                document.getElementById('loginToggle').classList.remove('active');
                document.getElementById('registerPanel').classList.add('active');
                document.getElementById('loginPanel').classList.remove('active');
                document.getElementById('loginError').style.display = 'none';
                document.getElementById('regError').style.display = 'none';
            };

            // LOGIN
            document.getElementById('loginBtn').onclick = async function() {
                const email = document.getElementById('loginEmail').value.trim().toLowerCase();
                const password = document.getElementById('loginPassword').value;

                if (!email || !password) {
                    showError('login', 'Please enter both email and password.');
                    return;
                }

                const lockedUntil = isLocked(email);
                if (lockedUntil) {
                    const mins = Math.ceil((lockedUntil - Date.now()) / 60000);
                    showError('login', `Too many failed attempts. Try again in ${mins} minute(s).`);
                    return;
                }

                const users = getStoredUsers();
                let user = users.find(u => u.email === email);

                // Super Admin is created only once. A wrong password can NEVER overwrite it.
                if (email === SUPER_ADMIN_EMAIL && !user) {
                    const record = await createPasswordRecord(password);
                    user = {
                        name: 'Super Admin', email: SUPER_ADMIN_EMAIL,
                        ...record, status: 'approved', role: 'admin', mobile: ''
                    };
                    users.push(user);
                    saveUsers(users);
                    await createSession(user);
                    window.location.href = 'dashboard.html';
                    return;
                }

                if (!user) {
                    recordFailedLogin(email);
                    showError('login', 'Invalid email or password.');
                    return;
                }

                const valid = await verifyPassword(user, password);
                if (!valid) {
                    recordFailedLogin(email);
                    showError('login', 'Invalid email or password.');
                    return;
                }

                // Persist a legacy-account hash upgrade if verifyPassword migrated it.
                saveUsers(users);
                clearLoginLock(email);

                if (email === SUPER_ADMIN_EMAIL) {
                    user.status = 'approved';
                    user.role = 'admin';
                    saveUsers(users);
                }

                const settings = getSettings();
                if (settings.approvalRequired && user.status !== 'approved') {
                    showError('login', '⏳ Your account is pending admin approval.');
                    return;
                }

                await createSession(user);
                window.location.href = 'dashboard.html';
            };

            // REGISTER
            document.getElementById('registerBtn').onclick = async function() {
                const firstName = document.getElementById('regFirstName').value.trim();
                const lastName = document.getElementById('regLastName').value.trim();
                const email = document.getElementById('regEmail').value.trim().toLowerCase();
                const mobile = document.getElementById('regMobile').value.trim();
                const password = document.getElementById('regPassword').value;

                if (!firstName || !lastName || !email || !password) {
                    showError('reg', 'First name, last name, email, and password are required.');
                    return;
                }
                if (password.length < 8 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
                    showError('reg', 'Password must be 8+ characters and include uppercase, lowercase and a number.');
                    return;
                }
                if (!email.includes('@')) {
                    showError('reg', 'Please enter a valid email address.');
                    return;
                }
                if (email === SUPER_ADMIN_EMAIL) {
                    showError('reg', 'This email is reserved for Super Admin.');
                    return;
                }

                const users = getStoredUsers();
                if (users.find(u => u.email === email)) {
                    showError('reg', 'An account with this email already exists. Please log in.');
                    return;
                }

                const passwordRecord = await createPasswordRecord(password);
                const newUser = {
                    name: firstName + ' ' + lastName,
                    firstName, lastName, email,
                    ...passwordRecord,
                    mobile: mobile || '',
                    status: 'pending', role: 'user',
                    registeredAt: new Date().toISOString()
                };

                users.push(newUser);
                saveUsers(users);

                alert('✅ Registration successful! Your password is securely stored. Your account is pending admin approval.');

                document.getElementById('regFirstName').value = '';
                document.getElementById('regLastName').value = '';
                document.getElementById('regEmail').value = '';
                document.getElementById('regMobile').value = '';
                document.getElementById('regPassword').value = '';
                document.getElementById('loginToggle').click();
            };

            // Enter key
            document.getElementById('loginPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('loginBtn').click();
            });
            document.getElementById('regPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('registerBtn').click();
            });
        })();
    </script>
</body>
</html>
